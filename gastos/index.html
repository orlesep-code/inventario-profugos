<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F6F6B">
<title>Gastos Prófugos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra arriba con pestañas Anotar / Ventas vs gastos; formulario de una columna con botones grandes; resumen con tarjetas y barras */
:root{
  --bg:#F3F1EC; --surface:#FFFFFF; --line:#DAD6CC; --ink:#1E2423; --muted:#5E6966;
  --accent:#1F6F6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBE9;
  --good:#2F7A3A; --good-soft:#E1F0E3; --bad:#B3261E; --bad-soft:#FBE3E1; --warn:#A8560B; --warn-soft:#FBEBD8;
  --sales:#1F6F6B; --cost:#C2571B;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151A19; --surface:#1E2523; --line:#33403D; --ink:#EAF0EE; --muted:#A3B0AC;
  --accent:#5FB3AC; --accent-ink:#0E1716; --accent-soft:#1F3634;
  --good:#7CC487; --good-soft:#1E3322; --bad:#F2948C; --bad-soft:#3D1F1C; --warn:#F0A55A; --warn-soft:#3A2A18;
  --sales:#5FB3AC; --cost:#F08A4B; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 0;display:grid;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.links{display:flex;gap:6px}
.links a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.tabs{display:flex;gap:0}
.tab{flex:1;border:0;background:none;font:600 16px var(--body);color:var(--muted);padding:12px 8px;border-bottom:3px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main .wrap{padding-block:18px 60px;display:grid;gap:18px}
h2{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.lbl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:block}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px;width:100%}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px;font:600 15px var(--body);min-height:52px;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .chip{flex:1;text-align:center;min-width:110px}
.monto{display:flex;align-items:center;gap:8px}
.monto span{font-family:var(--display);font-size:36px;color:var(--muted)}
.monto input{font-family:var(--display);font-size:38px;font-weight:700;padding:6px 12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.foto{border:2px dashed var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;justify-items:center;text-align:center;background:var(--surface)}
.foto img{max-height:260px;border-radius:8px;border:1px solid var(--line)}
.btn{font:600 16px var(--body);border-radius:10px;padding:12px 18px;min-height:50px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{font-size:19px;min-height:60px;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{min-height:40px;padding:8px 12px;font-size:14px}
.msg{border-radius:10px;padding:12px 14px;font-size:15px}
.msg.ok{background:var(--good-soft);color:var(--ink)}
.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--ink)}
.pend{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* resumen */
.mesbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mesbar .btn{min-height:44px;padding:8px 14px}
.mesbar b{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .v{font-family:var(--display);font-size:clamp(26px,6vw,38px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.card .s{font-size:13px;color:var(--muted)}
.card.util{grid-column:1/-1}
.card.util.pos{background:var(--good-soft);border-color:var(--good)}
.card.util.neg{background:var(--bad-soft);border-color:var(--bad)}
.card.util.pos .v{color:var(--good)} .card.util.neg .v{color:var(--bad)}
.vs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.bar{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:center;font-size:14px}
.track{height:22px;background:var(--bg);border-radius:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:6px}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.catrow .track{grid-column:1/-1;height:10px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.item .c{font-weight:600}
.item .d{color:var(--muted);font-size:13px}
.item a{font-size:13px;color:var(--accent)}
.pinbox{max-width:360px;margin:40px auto;display:grid;gap:12px;text-align:center}
.pinbox input{text-align:center;font-size:30px;letter-spacing:.3em;font-family:var(--display)}
.foot{font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>Prófugos <span>· Gastos</span></h1>
    <div class="links"><a href="../">Inventario</a><a href="../manual/">Manual</a></div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabAnotar" aria-selected="true">Anotar gasto</button>
    <button class="tab" role="tab" id="tabResumen" aria-selected="false">Ventas vs gastos</button>
  </nav>
</div></header>

<main><div class="wrap">

<div id="pendTop"></div>

<section id="vPin" hidden>
  <form class="pinbox" id="pinForm">
    <h2>Escribí el PIN</h2>
    <p class="foot" style="margin:0">Solo se pide una vez en esta tablet. Protege tus ventas y gastos.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" aria-label="PIN">
    <div id="pinMsg"></div>
    <button class="btn primary big" type="submit">Entrar</button>
  </form>
</section>

<section id="vAnotar" hidden>
  <div id="pendBox"></div>
  <form id="gForm" style="display:grid;gap:18px" novalidate>
    <div>
      <span class="lbl">Foto de la factura o recibo</span>
      <div class="foto" id="fotoBox">
        <img id="fotoPrev" alt="Foto del comprobante" hidden>
        <label class="btn primary" for="fotoIn" id="fotoBtn">Tomar foto</label>
        <input id="fotoIn" type="file" accept="image/*" capture="environment" hidden>
        <button class="btn" type="button" id="fotoDel" hidden>Quitar foto</button>
        <span class="foot" id="fotoInfo">Opcional, pero recomendado. Se guarda en tu Google Drive.</span>
      </div>
    </div>

    <div>
      <span class="lbl">Categoría</span>
      <div class="cats" id="cats"></div>
    </div>

    <div>
      <label class="lbl" for="monto">Monto</label>
      <div class="monto"><span>L</span><input id="monto" type="text" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
      <div class="quick" id="quick" style="margin-top:10px"></div>
    </div>

    <div class="grid2">
      <div><label class="lbl" for="concepto">Concepto</label><input id="concepto" placeholder="Ej. 10 cajas Salva Vida" maxlength="120"></div>
      <div><label class="lbl" for="proveedor">Proveedor o persona</label><input id="proveedor" placeholder="Ej. Cervecería Hondureña" maxlength="120"></div>
    </div>

    <div>
      <span class="lbl">Forma de pago</span>
      <div class="row" id="pagos"></div>
    </div>

    <div class="grid2">
      <div><label class="lbl" for="fecha">Fecha del gasto</label><input id="fecha" type="date"></div>
      <div><label class="lbl" for="factura">N° factura o recibo</label><input id="factura" placeholder="Opcional" maxlength="40"></div>
    </div>
    <div><label class="lbl" for="resp">Quién registra</label><input id="resp" placeholder="Tu nombre" maxlength="40"></div>

    <div id="gMsg"></div>
    <button class="btn primary big" type="submit" id="gSave">Guardar gasto</button>
  </form>
</section>

<section id="vResumen" hidden>
  <div class="mesbar">
    <button class="btn" type="button" id="mPrev" aria-label="Mes anterior">‹</button>
    <b id="mLabel"></b>
    <button class="btn" type="button" id="mNext" aria-label="Mes siguiente">›</button>
  </div>
  <div id="rBody"></div>
</section>

</div></main>

<script>
const API = "https://script.google.com/macros/s/AKfycbx_B30zc07BrT-UT1JhmXP03mCQHxKKYezXpLLcE-02rpMEkmdTpwRn8BOFEGu93fmX/exec";
const CATS = ['Compras de producto','Planillas','Alquiler','Servicios públicos','Entretenimiento','Seguridad','Impuestos SAR','Otros gastos'];
const PAGOS = ['Efectivo','Transferencia','Tarjeta'];
const QUICK = [
  {t:'DJ (jue a sáb)', cat:'Entretenimiento', m:5000, c:'Pago DJ', p:''},
  {t:'Banda (vie a sáb)', cat:'Entretenimiento', m:12000, c:'Pago banda en vivo', p:''},
];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L = n => 'L ' + Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const store = {
  get(k,d){ try{ const v = localStorage.getItem('gp_'+k); return v === null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k,v){ try{ localStorage.setItem('gp_'+k, JSON.stringify(v)); return true }catch(e){ return false } }
};
const hoy = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}` };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mesTxt = m => { const [y,mm] = m.split('-'); return MESES[+mm-1] + ' ' + y };

async function api(body){
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}

/* ---------- estado ---------- */
let pin = store.get('pin','');
const F = {cat:null, pago:'Efectivo', foto:null};
let vista = 'anotar';

/* ---------- vistas ---------- */
function show(v){
  vista = v;
  $('tabAnotar').setAttribute('aria-selected', v==='anotar');
  $('tabResumen').setAttribute('aria-selected', v==='resumen');
  if (!pin){ $('vPin').hidden = false; $('vAnotar').hidden = true; $('vResumen').hidden = true; return }
  $('vPin').hidden = true;
  $('vAnotar').hidden = v !== 'anotar';
  $('vResumen').hidden = v !== 'resumen';
  if (v === 'resumen') cargarResumen();
}
$('tabAnotar').onclick = () => show('anotar');
$('tabResumen').onclick = () => show('resumen');

$('pinForm').onsubmit = async e => {
  e.preventDefault();
  const p = $('pin').value.trim();
  if (!/^\d{4,8}$/.test(p)){ $('pinMsg').innerHTML = '<div class="msg err">El PIN es de 4 a 8 números.</div>'; return }
  $('pinMsg').innerHTML = '<div class="msg warn"><span class="spin"></span> Revisando…</div>';
  try{
    const r = await api({accion:'pin', pin:p});
    if (r.ok && r.pinValido === true){ pin = p; store.set('pin', p); $('pinMsg').innerHTML = ''; show(vista); pintarCola() }
    else if (r.ok && r.pinValido === undefined) $('pinMsg').innerHTML = '<div class="msg err">El sistema de gastos todavía no está activado. Avisale a Orles.</div>';
    else $('pinMsg').innerHTML = '<div class="msg err">PIN incorrecto. Probá de nuevo.</div>';
  }catch(err){ $('pinMsg').innerHTML = '<div class="msg err">Sin conexión. Conectate al wifi para entrar la primera vez.</div>' }
};

/* ---------- formulario ---------- */
function pintarCats(){
  $('cats').innerHTML = CATS.map(c => `<button type="button" class="chip" aria-pressed="${F.cat===c}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { F.cat = b.dataset.c; pintarCats() });
}
function pintarPagos(){
  $('pagos').innerHTML = PAGOS.map(p => `<button type="button" class="chip" aria-pressed="${F.pago===p}" data-p="${p}">${p}</button>`).join('');
  $('pagos').querySelectorAll('.chip').forEach(b => b.onclick = () => { F.pago = b.dataset.p; pintarPagos() });
}
$('quick').innerHTML = QUICK.map((q,i) => `<button type="button" class="btn" data-q="${i}">${esc(q.t)} · ${L(q.m)}</button>`).join('');
$('quick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
  const q = QUICK[+b.dataset.q]; F.cat = q.cat; $('monto').value = q.m; $('concepto').value = q.c; pintarCats();
});
$('fecha').value = hoy();
$('resp').value = store.get('resp','');

/* foto: se achica a 1600 px y JPEG para que suba rápido */
$('fotoIn').onchange = async () => {
  const f = $('fotoIn').files[0]; if (!f) return;
  $('fotoInfo').textContent = 'Preparando foto…';
  try{
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok,ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = url });
    const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', 0.72);
    F.foto = data.split(',')[1];
    $('fotoPrev').src = data; $('fotoPrev').hidden = false; $('fotoDel').hidden = false;
    $('fotoBtn').textContent = 'Tomar otra foto';
    $('fotoInfo').textContent = `Foto lista (${Math.round(F.foto.length*0.75/1024)} KB).`;
  }catch(e){ F.foto = null; $('fotoInfo').textContent = 'No se pudo leer la foto. Probá tomarla de nuevo.' }
};
$('fotoDel').onclick = () => { F.foto = null; $('fotoIn').value = ''; $('fotoPrev').hidden = true; $('fotoDel').hidden = true; $('fotoBtn').textContent = 'Tomar foto'; $('fotoInfo').textContent = 'Opcional, pero recomendado. Se guarda en tu Google Drive.' };

function limpiar(){
  F.cat = null; $('monto').value = ''; $('concepto').value = ''; $('proveedor').value = ''; $('factura').value = '';
  $('fecha').value = hoy(); $('fotoDel').onclick(); pintarCats();
}

/* cola: si no hay internet, el gasto queda guardado en la tablet y se envía después */
function cola(){ return store.get('cola', []) }
let verPend = false;
function pintarCola(){
  const c = cola();
  $('pendBox').innerHTML = '';
  if (!c.length){ $('pendTop').innerHTML = ''; return }
  const total = c.reduce((s,g) => s + (Number(g.monto)||0), 0);
  let html = `<div class="msg warn pend"><span>${c.length} gasto${c.length>1?'s':''} sin enviar, guardado${c.length>1?'s':''} en esta tablet · total ${L(total)}.</span>
    <span class="row" style="flex:0 0 auto"><button class="btn" type="button" id="verPend">${verPend ? 'Ocultar' : 'Ver pendientes'}</button>${pin ? '<button class="btn" type="button" id="reenviar">Enviar ahora</button>' : ''}</span></div>`;
  if (verPend){
    const ord = c.slice().sort((x,y) => String(x.fecha) < String(y.fecha) ? -1 : 1);
    html += `<div class="vs" style="margin-top:10px"><h2>Gastos guardados en la tablet</h2><div class="list">` +
      ord.map((g,i) => `<div class="item"><span class="c">${i+1}. ${esc(g.categoria)}${g.concepto ? ' · ' + esc(g.concepto) : ''}</span><span class="num">${L(g.monto)}</span>
        <span class="d">${esc(g.fecha)} · ${esc(g.pago||'')}${g.proveedor ? ' · ' + esc(g.proveedor) : ''}${g.factura ? ' · Fact. ' + esc(g.factura) : ''}${g.responsable ? ' · ' + esc(g.responsable) : ''}</span>
        <span class="d">${g.foto ? 'Con foto' : 'Sin foto'}</span>
        ${g.foto ? `<img src="data:image/jpeg;base64,${g.foto}" alt="Comprobante" style="grid-column:1/-1;max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);margin-top:6px">` : ''}</div>`).join('') +
      `</div><div class="bar" style="grid-template-columns:1fr auto"><b>Total</b><span class="num">${L(total)}</span></div></div>`;
  }
  $('pendTop').innerHTML = html;
  $('verPend').onclick = () => { verPend = !verPend; pintarCola() };
  if (pin) $('reenviar').onclick = enviarCola;
}
let enviando = false;
async function enviarCola(){
  if (enviando) return; enviando = true;
  let c = cola(), fallo = null;
  for (const g of c.slice()){
    try{
      const r = await api(Object.assign({}, g, {accion:'gasto', pin}));
      if (r.ok && r.gastoGuardado){ c = c.filter(x => x.id !== g.id); store.set('cola', c) }
      else { fallo = r.error || 'error'; break }
    }catch(e){ fallo = 'red'; break }
  }
  enviando = false; pintarCola();
  return fallo;
}

$('gForm').onsubmit = async e => {
  e.preventDefault();
  const monto = parseFloat(String($('monto').value).replace(/[^0-9.]/g,''));
  if (!F.cat){ $('gMsg').innerHTML = '<div class="msg err">Elegí una categoría.</div>'; return }
  if (!(monto > 0)){ $('gMsg').innerHTML = '<div class="msg err">Escribí el monto.</div>'; $('monto').focus(); return }
  store.set('resp', $('resp').value.trim());
  const g = {id:'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), fecha:$('fecha').value || hoy(), categoria:F.cat, monto,
    concepto:$('concepto').value.trim(), proveedor:$('proveedor').value.trim(), pago:F.pago, factura:$('factura').value.trim(),
    responsable:$('resp').value.trim(), foto:F.foto};
  $('gSave').disabled = true; $('gSave').innerHTML = '<span class="spin"></span> Guardando…';
  let r = null;
  try{ r = await api(Object.assign({}, g, {accion:'gasto', pin})) }catch(err){ r = null }
  $('gSave').disabled = false; $('gSave').textContent = 'Guardar gasto';
  if (r && r.ok && r.gastoGuardado){
    $('gMsg').innerHTML = `<div class="msg ok">Guardado: ${esc(g.categoria)} · ${L(monto)}${r.foto ? ' · con foto' : ''}.</div>`;
    limpiar(); enviarCola();
  } else if (r && r.error === 'PIN incorrecto'){
    pin = ''; store.set('pin',''); show('anotar');
  } else {
    const c = cola(); c.push(g);
    if (store.set('cola', c)){
      $('gMsg').innerHTML = `<div class="msg warn">No hay conexión. El gasto quedó guardado en la tablet y se envía cuando vuelva el internet.</div>`;
      limpiar();
    } else {
      c.pop(); g.foto = null; c.push(g);
      if (store.set('cola', c)){ $('gMsg').innerHTML = `<div class="msg warn">Sin conexión y sin espacio para la foto. Se guardó el gasto sin foto en la tablet.</div>`; limpiar() }
      else $('gMsg').innerHTML = `<div class="msg err">No se pudo guardar. Revisá el internet e intentá de nuevo.</div>`;
    }
    pintarCola();
  }
  setTimeout(() => { const m = $('gMsg').firstElementChild; if (m && m.classList.contains('ok')) $('gMsg').innerHTML = '' }, 6000);
};
window.addEventListener('online', () => { if (pin && cola().length) enviarCola() });

/* ---------- resumen ---------- */
let mes = hoy().slice(0,7);
function moverMes(d){ let [y,m] = mes.split('-').map(Number); m += d; if (m<1){m=12;y--} if (m>12){m=1;y++} mes = `${y}-${String(m).padStart(2,'0')}`; cargarResumen() }
$('mPrev').onclick = () => moverMes(-1);
$('mNext').onclick = () => moverMes(1);

async function cargarResumen(){
  $('mLabel').textContent = mesTxt(mes);
  $('mNext').disabled = mes >= hoy().slice(0,7);
  const cache = store.get('res_'+mes, null);
  if (cache) pintarResumen(cache, true);
  else $('rBody').innerHTML = '<div class="msg warn"><span class="spin"></span> Cargando ventas y gastos…</div>';
  try{
    const r = await api({accion:'resumen', mes, pin});
    if (r.ok && r.ventas){ store.set('res_'+mes, r); if (r.mes === mes) pintarResumen(r, false) }
    else if (r.error === 'PIN incorrecto'){ pin = ''; store.set('pin',''); show('resumen') }
    else if (r.ok && !r.ventas) $('rBody').innerHTML = '<div class="msg err">El sistema de gastos todavía no está activado.</div>';
    else $('rBody').insertAdjacentHTML('afterbegin', `<div class="msg err">La hoja respondió con un error: ${esc(r.error||'')}</div>`);
  }catch(e){
    if (!cache) $('rBody').innerHTML = '<div class="msg err">Sin conexión. Conectate al wifi para ver el resumen.</div>';
  }
}

function pintarResumen(r, viejo){
  const v = r.ventas, g = r.gastos, util = v.total - g.total, pct = v.total ? util / v.total * 100 : 0;
  const max = Math.max(v.total, g.total, 1);
  const cats = Object.entries(g.porCategoria).sort((a,b) => b[1]-a[1]);
  const maxCat = cats.length ? cats[0][1] : 1;
  const dif = (a,b) => b ? ((a-b)/b*100) : null;
  const dv = dif(v.total, r.anterior.ventas), dg = dif(g.total, r.anterior.gastos);
  const flecha = x => x === null ? '' : `${x>=0?'▲':'▼'} ${Math.abs(x).toFixed(0)}% vs ${mesTxt(r.anterior.mes).split(' ')[0]}`;
  const avisos = [];
  if (v.revisar) avisos.push(`${v.revisar} cierre${v.revisar>1?'s':''} en REVISAR no se sumaron a las ventas.`);
  if (g.sinFoto) avisos.push(`${g.sinFoto} gasto${g.sinFoto>1?'s':''} sin foto de comprobante.`);
  if (!g.total) avisos.push('Todavía no hay gastos anotados este mes, así que la utilidad sale igual a la venta.');
  $('rBody').innerHTML = `
  ${viejo ? '<div class="msg warn">Mostrando lo último guardado. Actualizando…</div>' : ''}
  <div class="cards">
    <div class="card"><div class="k">Ventas</div><div class="v" style="color:var(--sales)">${L(v.total)}</div><div class="s">${v.turnos} cierres${v.ultima ? ' · hasta el ' + v.ultima.slice(8) + ' de ' + MESES[+v.ultima.slice(5,7)-1] : ''}<br>${flecha(dv)}</div></div>
    <div class="card"><div class="k">Gastos</div><div class="v" style="color:var(--cost)">${L(g.total)}</div><div class="s">${g.lista.length} registro${g.lista.length===1?'':'s'}<br>${flecha(dg)}</div></div>
    <div class="card util ${util>=0?'pos':'neg'}"><div class="k">${util>=0?'Utilidad del mes':'Pérdida del mes'}</div><div class="v">${L(util)}</div><div class="s">${pct.toFixed(1)}% de la venta · tu 20%: <b>${L(util*0.20)}</b></div></div>
  </div>
  <div class="vs" aria-label="Ventas contra gastos">
    <h2>Ventas contra gastos</h2>
    <div class="bar"><span>Ventas</span><div class="track"><i style="width:${v.total/max*100}%;background:var(--sales)"></i></div><span class="num">${L(v.total)}</span></div>
    <div class="bar"><span>Gastos</span><div class="track"><i style="width:${g.total/max*100}%;background:var(--cost)"></i></div><span class="num">${L(g.total)}</span></div>
    <div class="foot">Ventas: alimentos ${L(v.alimentos)} · bebidas ${L(v.bebidas)} · otros ${L(v.otros)}</div>
  </div>
  ${avisos.length ? `<div class="msg warn">${avisos.map(esc).join('<br>')}</div>` : ''}
  <div class="vs">
    <h2>¿En qué se fue la plata?</h2>
    ${cats.length ? cats.map(([c,m]) => `<div class="catrow"><span>${esc(c)}</span><span class="num">${L(m)} · ${g.total? (m/g.total*100).toFixed(0):0}%</span><div class="track"><i style="width:${m/maxCat*100}%;background:var(--cost)"></i></div></div>`).join('') : '<p class="foot" style="margin:0">Sin gastos en este mes.</p>'}
  </div>
  <div class="vs">
    <h2>Últimos gastos</h2>
    <div class="list">${g.lista.length ? g.lista.slice(0,25).map(x => `<div class="item"><span class="c">${esc(x.cat)}${x.concepto ? ' · ' + esc(x.concepto) : ''}</span><span class="num">${L(x.monto)}</span><span class="d">${esc(x.fecha)} · ${esc(x.pago||'')}${x.proveedor ? ' · ' + esc(x.proveedor) : ''}</span>${x.foto ? `<a href="${esc(x.foto)}" target="_blank" rel="noopener">Ver foto</a>` : '<span class="d">Sin foto</span>'}</div>`).join('') : '<p class="foot" style="margin:0">Todavía no hay gastos en este mes.</p>'}</div>
  </div>
  <p class="foot">Ventas de la hoja Cierres Profugos (solo cierres OK y SIN VENTA). Gastos de la hoja <a href="${esc(r.hojaGastos)}" target="_blank" rel="noopener">Gastos Prófugos</a>.</p>`;
}

/* ---------- inicio ---------- */
pintarCats(); pintarPagos(); pintarCola();
show('anotar');
if (pin && cola().length && navigator.onLine !== false) enviarCola();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>

<style>
/* Layout: one-screen game app. Poster-style "se busca" headings, 2x2 answer board like a TV game show, phones get big colored buttons. */
:root{
  --ink:#141110; --panel:#201b18; --panel2:#2a231f; --line:#3d332c;
  --paper:#f3e9d8; --muted:#b3a48f; --amber:#f2a33a;
  --red:#d9433a; --blue:#2d7bdc; --yellow:#e2ac12; --green:#2c9f4f;
  --display:'Anton',Impact,'Arial Narrow Bold',sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:20px;max-width:1500px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px}
.eyebrow{font-weight:800;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--amber)}
.display{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:0;border-radius:10px;padding:14px 22px;font-weight:800;font-size:17px;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);color:var(--ink);border-color:var(--amber)}
a.btn{text-decoration:none;color:var(--paper);display:inline-block}
a.btn.primary{color:var(--ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{font-size:20px;padding:18px 28px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px;color:var(--muted)}
input[type=text],textarea,select{background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-size:18px;width:100%}
textarea{font-size:14px;min-height:110px;resize:vertical}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}

/* topbar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.brand b{color:var(--amber);font-weight:400}

/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:stretch;flex:1}
.wanted{border:2px solid var(--amber);border-radius:6px;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:16px;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(242,163,58,.035) 14px 28px)}
.wanted .display{font-size:clamp(44px,7vw,104px)}
.wanted .display span{color:var(--amber)}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--ink);border-radius:999px;padding:10px 16px;font-weight:600}
.chip[aria-pressed=true]{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.chip small{opacity:.7;font-weight:400;margin-left:4px}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;flex:1}
@media (max-width:820px){.lobby{grid-template-columns:1fr}}
.code{font-family:var(--display);font-size:clamp(72px,12vw,170px);line-height:.9;color:var(--amber);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.qr{background:var(--paper);padding:12px;border-radius:10px;width:fit-content}
.qr img,.qr canvas{display:block;width:220px;height:220px;max-width:100%}
.link{font-size:14px;word-break:break-all;color:var(--muted)}
.teams{display:flex;flex-wrap:wrap;gap:10px}
.team{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
.team .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.team.off .dot{background:var(--muted)}
.team .tag{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.notice{border-left:4px solid var(--amber);background:var(--panel2);padding:12px 14px;border-radius:6px;font-size:15px}

/* question (TV) */
.qbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.timer{margin-left:auto;font-family:var(--display);font-size:56px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.track{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--amber);width:100%;transition:width .2s linear}
.qtext{font-size:clamp(28px,4.6vw,66px);font-weight:800;line-height:1.12;text-wrap:balance;margin:6px 0;flex:0 0 auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0}
@media (max-width:600px){.answers{grid-template-columns:1fr}}
.ans{border-radius:12px;padding:18px 22px;display:flex;align-items:center;gap:16px;font-weight:800;font-size:clamp(20px,2.6vw,38px);line-height:1.15;border:0;text-align:left;min-height:84px;position:relative;color:#fff}
.ans .sh{font-size:.9em;opacity:.95;flex:0 0 auto;width:1.3em;text-align:center}
.ans.c0{background:var(--red)} .ans.c1{background:var(--blue)} .ans.c2{background:var(--yellow);color:var(--ink)} .ans.c3{background:var(--green)}
.ans.dim{opacity:.22}
.ans .count{margin-left:auto;font-family:var(--display);font-weight:400;font-size:1.1em;font-variant-numeric:tabular-nums}
.ans.win{outline:5px solid var(--paper);outline-offset:3px}
.answered{font-weight:600;color:var(--muted)}

/* scoreboard */
.board{display:flex;flex-direction:column;gap:10px;max-width:900px;width:100%;margin:0 auto}
.brow{display:grid;grid-template-columns:3ch minmax(0,1fr) auto auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;font-size:clamp(18px,2.2vw,28px);font-weight:800}
.brow .pos{font-family:var(--display);font-weight:400;color:var(--amber);font-variant-numeric:tabular-nums}
.brow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .gain{font-size:.62em;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums}
.brow .pts{font-variant-numeric:tabular-nums}
.manual{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mchip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 14px;font-weight:700}
.mchip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end;max-width:1000px;width:100%;margin:0 auto}
.pod{border:2px solid var(--amber);border-radius:6px;padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:flex-end;background:var(--panel)}
.pod .place{font-family:var(--display);color:var(--amber);font-size:clamp(40px,6vw,80px);line-height:1}
.pod .nm{font-weight:800;font-size:clamp(18px,2.4vw,30px);overflow-wrap:anywhere}
.pod .pts{color:var(--muted);font-variant-numeric:tabular-nums}
.pod.p1{min-height:300px;background:var(--amber);color:var(--ink)} .pod.p1 .place,.pod.p1 .pts{color:var(--ink)}
.pod.p2{min-height:230px} .pod.p3{min-height:180px}

/* premios */
.prize{border:2px solid var(--amber);border-radius:6px;padding:16px 20px;max-width:900px;width:100%;margin:0 auto;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(242,163,58,.07) 14px 28px)}
.prize .big{font-family:var(--display);text-transform:uppercase;font-size:clamp(26px,3.4vw,44px);line-height:1.05;min-width:0;overflow-wrap:anywhere}
.prize .big span{color:var(--amber)}
.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* phone player */
.phone{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}
.phead .score{color:var(--amber);font-variant-numeric:tabular-nums}
.pq{font-size:20px;font-weight:800;line-height:1.25}
.pbtns{display:grid;grid-template-columns:1fr;gap:12px;flex:1}
.pbtns .ans{font-size:20px;min-height:72px}
.ptrack{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.ptrack i{display:block;height:100%;background:var(--amber);width:100%;transform-origin:left;animation:drain linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px}
.result{border-radius:16px;padding:34px 20px}
.result.ok{background:var(--green);color:#fff}
.result.bad{background:var(--red);color:#fff}
.result .display{font-size:52px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app"></div>

  const CH = [[110,[220,261.63,329.63]],[87.31,[174.61,220,261.63]],[130.81,[261.63,329.63,392]],[98,[196,246.94,293.66]]];

      if (s % 2 === 0) noise(t, 0.03, 0.18, 8000, 1, musicBus);

      if ([2,10].includes(s)) triad.forEach(f => tone(f, t, 0.22, 'square', 0.05, musicBus));

  return {
    get on(){ return on },
    unlock(){ ensure() },

    stopMusic(){ music = false; clearInterval(timer) },
    duck(x){ if (!ctx) return; musicBus.gain.setTargetAtTime(x ? 0.07 : 0.2, ctx.currentTime, 0.15) },
    toggle(){ on = !on; ls.set('pf_sound', on ? 'on' : 'off'); if (ensure()) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05); return on },

        o.connect(a); a.connect(f1); a.connect(f2);
        o.start(t + 0.03); v.start(t + 0.03); o.stop(t + 0.1 + d); v.stop(t + 0.1 + d);
      } },
    melody(notes, bpm){ if (!ensure()) return 0; const spb = 60/(bpm||110); let t = ctx.currentTime + 0.1;
      notes.trim().split(/\s+/).forEach(tok => { const [n, d] = tok.split(':'); const dur = parseFloat(d) * spb;

          tone(f, t, Math.max(0.25, dur*0.95), 'triangle', 0.55, sfxBus); tone(f*2, t, Math.max(0.2, dur*0.6), 'sine', 0.12, sfxBus) }

    tick(final){ if (!ensure()) return; tone(final ? 1320 : 990, ctx.currentTime + 0.01, 0.07, 'square', 0.12, sfxBus) },

})();

function customQs(){

}
function pool(){ return BANK.concat(customQs()).filter(q => H.cfg.cats.has(q[0])) }
function uniq(a){ return [...new Set(a)] }
function songQ(i){
  const s = SONGS[i], f = Math.random() < 0.35 ? 1 : 0;
  const names = v => v.split(/ y | & /).map(x => x.trim().toLowerCase());
  const clash = v => f === 1 && names(v).some(n => names(s[1]).includes(n));
  const wrong = shuffle(uniq(SONGS.filter((x,j) => j !== i).map(x => x[f])).filter(v => v !== s[f] && !clash(v))).slice(0,3);
  const opts = shuffle([s[f], ...wrong]);
  return {cat:'can', kind:'dj', song:{title:s[0], artist:s[1]}, text: f ? '¡Que suene! ¿Quién canta esta canción?' : '¡Que suene! ¿Cómo se llama esta canción?', opts, ci:opts.indexOf(s[f])};
}
function melQ(i){
  const m = MELODIES[i];
  const opts = shuffle([m[0], ...shuffle(MELODIES.filter((x,j) => j !== i).map(x => x[0])).slice(0,3)]);
  return {cat:'mel', kind:'mel', notes:m[1], bpm:m[2], text:'Escuchen la melodía. ¿Cuál es?', opts, ci:opts.indexOf(m[0])};
}
function catPool(k){
  const all = BANK.concat(customQs());
  const out = (k === 'mix' ? all : all.filter(q => q[0] === k)).map(q => ({key:'b:' + q[1], make:() => { const opts = shuffle(q.slice(2).map((t,i) => ({t, ok:i===0}))); return {cat:q[0], text:q[1], opts:opts.map(o => o.t), ci:opts.findIndex(o => o.ok)} }}));
  if (k === 'mix' || k === 'mel') MELODIES.forEach((_,i) => out.push({key:'m:' + i, make:() => melQ(i)}));
  return out;
}
function buildQs(){
  const used = new Set(), out = [];
  for (let r = 0; r < H.cfg.rounds; r++){
    const k = H.cfg.themes[r] || 'mix';
    let items = shuffle(catPool(k).filter(it => !used.has(it.key))).slice(0, H.cfg.per);
    if (items.length < H.cfg.per) items = items.concat(shuffle(catPool('mix').filter(it => !used.has(it.key) && !items.includes(it))).slice(0, H.cfg.per - items.length));
    items.forEach(it => { used.add(it.key); const q = it.make(); q.round = r + 1; q.theme = k; out.push(q) });
  }

  return out;
}

function hostCreate(){

function startPeer(){
  H.peerOk = null;
  if (typeof Peer === 'undefined'){ H.peerOk = false; return }
  try{
    const p = new Peer(PREFIX + H.code, {debug:0});
    H.peer = p;
    const fail = setTimeout(() => { if (H.peerOk === null){ H.peerOk = false; if (H.phase==='lobby') renderLobby() } }, 9000);
    p.on('open', () => { clearTimeout(fail); H.peerOk = true; if (H.phase==='lobby') renderLobby() });
    p.on('connection', attach);
    p.on('disconnected', () => { try{ p.reconnect() }catch(e){} });
    p.on('error', e => {
      if (e.type === 'unavailable-id'){ clearTimeout(fail); p.destroy(); H.code = String(1000 + Math.floor(Math.random()*9000)); startPeer(); return }
      if (H.peerOk === null){ clearTimeout(fail); H.peerOk = false; if (H.phase==='lobby') renderLobby() }
    });
  }catch(e){ H.peerOk = false }
}

function send(t, m){ if (t.conn && t.conn.open){ try{ t.conn.send(m) }catch(e){} } }
function ranked(){ return H.teams.slice().sort((a,b) => b.score - a.score) }

function qMsg(){ const q = H.qs[H.qi]; return {t:'q', i:H.qi, total:H.qs.length, label:posLabel(), text:q.text, opts:q.opts, left:Math.max(0, H.qTime*1000 - (Date.now()-H.qStart))} }

function attach(conn){
  conn.on('data', d => onHostMsg(conn, d));
  conn.on('close', () => {
    if (conn.isDJ){ H.djs = (H.djs||[]).filter(c => c !== conn); if (H.phase === 'lobby') renderLobby(); return }
    const t = H.teams.find(x => x.conn === conn); if (t){ t.online = false; refreshTeams() }
  });
}
function onHostMsg(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.t === 'join' && d.dj){
    conn.isDJ = true; H.djs = H.djs || []; if (!H.djs.includes(conn)) H.djs.push(conn);
    try{ conn.send(djState()) }catch(e){}
    if (H.phase === 'lobby') renderLobby(); return;
  }
  if (d.t === 'join'){
    const name = String(d.name||'').trim().slice(0,24) || 'Mesa sin nombre';
    let t = H.teams.find(x => !x.manual && x.name.toLowerCase() === name.toLowerCase());
    if (t){ t.conn = conn; t.online = true }
    else { t = {id:'t'+Date.now()+Math.random().toString(36).slice(2,6), name, score:0, last:0, conn, online:true, manual:false}; H.teams.push(t) }
    send(t, {t:'welcome', name:t.name, score:t.score});
    if (H.phase === 'question' && !H.answers.has(t.id)) send(t, qMsg());
    refreshTeams(); return;
  }
  const t = H.teams.find(x => x.conn === conn); if (!t) return;
  if (d.t === 'ans' && H.phase === 'question' && d.i === H.qi && !H.answers.has(t.id)){
    const q = H.qs[H.qi]; const k = Number(d.k);
    const el = Math.min(1, (Date.now()-H.qStart) / (H.qTime*1000));
    const ok = k === q.ci;
    H.answers.set(t.id, {k, ok, pts: ok ? Math.round(1000 - 500*el) : 0});
    send(t, {t:'got'});
    const live = H.teams.filter(x => !x.manual && x.online);
    const a = document.getElementById('answered'); if (a) a.textContent = `${H.answers.size} de ${live.length} mesas respondieron`;
    if (live.length && live.every(x => H.answers.has(x.id))) closeQuestion();
  }
}

    <div class="panel stack">
      <div class="row" style="justify-content:space-between"><h2 class="display" style="font-size:40px">Mesas en juego</h2><span class="pill">${H.teams.length}</span></div>
      <div class="teams">${H.teams.length ? H.teams.map(t => `<div class="team ${t.online||t.manual?'':'off'}">${t.manual?'':'<span class="dot"></span>'}${esc(t.name)}${t.manual?'<span class="tag">a mano</span>':''}</div>`).join('') : '<p class="muted" style="margin:0">Todavía no hay mesas. Apenas escaneen el QR aparecen aquí.</p>'}</div>
      <p class="muted" style="margin:0">${H.R} rondas de ${H.cfg.per} preguntas · ${H.cfg.time} segundos cada una</p>
      <ol class="muted" style="margin:0;padding-left:20px">${Array.from({length:H.R}, (_,i) => `<li>${esc(themeName(H.cfg.themes[i] || 'mix'))}</li>`).join('')}</ol>
      <div class="row" style="margin-top:auto"><button class="btn primary big" data-act="start" ${H.teams.length?'':'disabled'}>Empezar la trivia</button></div>
    </div>
  </div>`;
  if (phones !== false && typeof QRCode !== 'undefined'){
    try{ new QRCode(document.getElementById('qr'), {text:url, width:220, height:220, colorDark:'#141110', colorLight:'#f3e9d8', correctLevel:QRCode.CorrectLevel.M}) }catch(e){}
  }
}

function startQuestion(){
  H.qi++;
  if (H.qi >= H.qs.length) return renderEnd();
  const q = H.qs[H.qi];
  H.qTime = H.cfg.time + (q.kind ? 15 : 0);
  H.phase = 'question'; H.answers = new Map(); H.manualOk = new Set(); H.qStart = Date.now() + (q.kind === 'mel' ? 1500 : 0);
  H.teams.forEach(t => send(t, qMsg()));
  djBroadcast();
  app.innerHTML = `${topBar()}
  <div class="qbar">
    <span class="pill">${posLabel()}</span><span class="pill">${CATS[q.cat]}</span>
    <span class="answered" id="answered">0 de ${H.teams.filter(x=>!x.manual&&x.online).length} mesas respondieron</span>
    <span class="timer" id="timer">${H.qTime}</span>
  </div>
  <div class="track"><i id="bar"></i></div>
  <div class="qtext">${esc(q.text)}</div>
  <div class="answers">${q.opts.map((o,i) => `<div class="ans c${i}"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span></div>`).join('')}</div>
  ${q.kind === 'dj' ? `<div class="notice">${(H.djs||[]).some(c => c.open) ? 'El DJ ya tiene la canción en su celular. ¡Que suene!' : 'No hay DJ conectado. Pon la canción tú mismo: toca "Ver canción" solo si nadie está viendo esta pantalla.'} <span id="peek" style="font-weight:800"></span></div>` : ''}
  <div class="row"><button class="btn" data-act="close">Cerrar pregunta</button>${q.kind === 'mel' ? '<button class="btn" data-act="replay">Repetir melodía</button>' : ''}${q.kind === 'dj' ? '<button class="btn" data-act="peek">Ver canción</button>' : ''}</div>`;
  clearInterval(H.tick);
  if (q.kind){ SFX.stopMusic(); if (q.kind === 'mel') setTimeout(() => { if (H.phase === 'question' && H.qs[H.qi] === q) SFX.melody(q.notes, q.bpm) }, 900) }
  else { SFX.startMusic(); SFX.duck(true) }
  let lastSec = H.qTime;
  H.tick = setInterval(() => {
    const left = H.qTime*1000 - (Date.now()-H.qStart);
    const tEl = document.getElementById('timer'), b = document.getElementById('bar');
    const sec = Math.max(0, Math.ceil(left/1000));
    if (sec !== lastSec){ lastSec = sec; if (sec <= 5 && sec > 0) SFX.tick(sec === 1) }
    if (tEl) tEl.textContent = Math.min(sec, H.qTime);
    if (b) b.style.width = Math.max(0, left/(H.qTime*1000))*100 + '%';
    if (left <= 0) closeQuestion();
  }, 200);
}

function closeQuestion(){
  if (H.phase !== 'question') return;
  clearInterval(H.tick); H.phase = 'reveal';
  const q = H.qs[H.qi];
  H.teams.forEach(t => { const a = H.answers.get(t.id); t.last = a ? a.pts : 0; t.score += t.last });
  H.teams.forEach(t => { if (t.manual) return; const a = H.answers.get(t.id);
    send(t, {t:'res', ok:!!(a&&a.ok), answered:!!a, pts:t.last, score:t.score, rank:rankOf(t), n:H.teams.length, correct:q.opts[q.ci]}) });
  SFX.startMusic(); SFX.duck(false); djBroadcast();
  const phones = H.teams.filter(x => !x.manual);
  const anyOk = [...H.answers.values()].some(a => a.ok);
  const anyFail = phones.some(x => { const a = H.answers.get(x.id); return !a || !a.ok });
  if (anyOk || !phones.length) SFX.ding();
  if (phones.length && anyFail) setTimeout(() => SFX.laugh(), anyOk ? 650 : 0);
  renderReveal();
}

function renderReveal(){
  const q = H.qs[H.qi];
  const counts = q.opts.map((_,i) => [...H.answers.values()].filter(a => a.k === i).length);
  const manual = H.teams.filter(t => t.manual);
  const last = H.qi === H.qs.length-1;
  app.innerHTML = `${topBar()}
  <div class="qbar"><span class="pill">${posLabel()}</span><span class="pill">${CATS[q.cat]}</span></div>
  <div class="qtext">${esc(q.text)}</div>
  ${q.kind === 'dj' ? `<p class="notice" style="margin:0">Sonó <strong>${esc(q.song.title)}</strong> de ${esc(q.song.artist)}</p>` : ''}
  <div class="answers">${q.opts.map((o,i) => `<div class="ans c${i} ${i===q.ci?'win':'dim'}"><span class="sh">${i===q.ci?'✔':SHAPES[i]}</span><span>${esc(o)}</span><span class="count">${counts[i]}</span></div>`).join('')}</div>
  ${manual.length ? `<div class="panel manual"><strong>¿Qué mesas sin celular acertaron?</strong>${manual.map(t => `<button class="mchip" data-act="mok" data-id="${t.id}" aria-pressed="${H.manualOk.has(t.id)}">${esc(t.name)}</button>`).join('')}<span class="muted">+750 pts cada una</span></div>` : ''}
  <div class="row"><button class="btn primary big" data-act="board">${last ? 'Ver ganadores' : 'Ver puntajes'}</button></div>`;
}

function toggleManual(id){
  const t = H.teams.find(x => x.id === id); if (!t) return;
  if (H.manualOk.has(id)){ H.manualOk.delete(id); t.score -= 750; t.last = 0 }
  else { H.manualOk.add(id); t.score += 750; t.last = 750; SFX.ding() }
  renderReveal();
}

function renderBoard(){
  if (H.qi === H.qs.length-1) return renderEnd();
  H.phase = 'board';
  let roundWin = null, roundNo = 0;
  const cur = roundInfo(H.qi), roundEnd = cur.pos === cur.of;
  if (roundEnd && H.cfg.roundPrize){
    roundNo = cur.n;
    let best = 0;
    H.teams.forEach(t => { const g = t.score - (t.rb||0); if (g > best){ best = g; roundWin = t } });
    if (roundWin) roundWin.gainRound = best;
    H.teams.forEach(t => t.rb = t.score);
  }
  H.teams.forEach(t => { if (!t.manual) send(t, {t:'wait', score:t.score, rank:rankOf(t), n:H.teams.length, prize: t === roundWin ? prize('round') : ''}) });
  const r = ranked().slice(0, 8);
  app.innerHTML = `${topBar()}
  ${roundWin ? `<div class="prize"><div class="stack" style="gap:4px;min-width:0"><div class="eyebrow">Ganador de la ronda ${roundNo} · +${roundWin.gainRound.toLocaleString('es-HN')} pts</div><div class="big"><span>${esc(roundWin.name)}</span> se lleva ${esc(prize('round'))}</div></div></div>` : ''}
  <div style="text-align:center"><div class="eyebrow">${roundEnd ? `Fin de la ronda ${cur.n} de ${H.R}` : `Ronda ${cur.n} · después de ${cur.pos} de ${cur.of} preguntas`}</div><h1 class="display" style="font-size:clamp(40px,6vw,80px)">Los más buscados</h1></div>
  <div class="board">${r.map((t,i) => `<div class="brow"><span class="pos">${i+1}</span><span class="nm">${esc(t.name)}</span><span class="gain">${t.last?'+'+t.last:''}</span><span class="pts">${t.score.toLocaleString('es-HN')}</span></div>`).join('')}</div>
  <div class="row" style="justify-content:center"><button class="btn primary big" data-act="next">${roundEnd ? `Ir a la ronda ${cur.n + 1}` : 'Siguiente pregunta'}</button></div>`;
}

function renderEnd(){
  H.phase = 'end'; clearInterval(H.tick); SFX.duck(false); SFX.fanfare();
  const r = ranked();
  let lastWin = null, best = 0;
  if (H.cfg.roundPrize){
    H.teams.forEach(t => { const g = t.score - (t.rb||0); if (g > best){ best = g; lastWin = t } });
    H.teams.forEach(t => t.rb = t.score);
  }
  r.forEach((t,i) => { if (!t.manual) send(t, {t:'end', rank:i+1, n:r.length, score:t.score, prize: [i===0 ? prize('final') : '', t===lastWin ? prize('round') : ''].filter(Boolean).join(' + ')}) });
  const pod = [r[1], r[0], r[2]];
  app.innerHTML = `${topBar()}
  <div style="text-align:center"><div class="eyebrow">Fin de las ${H.R} rondas · gana el mayor puntaje</div><h1 class="display" style="font-size:clamp(44px,7vw,96px)">Se busca: <span style="color:var(--amber)">${esc(r[0]?r[0].name:'nadie')}</span></h1></div>
  ${r[0] && r[0].score > 0 ? `<div class="prize"><div class="stack" style="gap:4px;min-width:0"><div class="eyebrow">Gran premio</div><div class="big"><span>${esc(r[0].name)}</span> se lleva ${esc(prize('final'))}</div>${lastWin ? `<div class="muted">Ganador de la ronda ${H.R}: <strong style="color:var(--paper)">${esc(lastWin.name)}</strong> se lleva ${esc(prize('round'))}</div>` : ''}</div></div>` : ''}
  <div class="podium">${pod.map((t,i) => t ? `<div class="pod p${[2,1,3][i]}"><div class="place">${[2,1,3][i]}°</div><div class="nm">${esc(t.name)}</div><div class="pts">${t.score.toLocaleString('es-HN')} pts</div></div>` : '<div></div>').join('')}</div>
  ${r.length > 3 ? `<div class="board">${r.slice(3).map((t,i) => `<div class="brow"><span class="pos">${i+4}</span><span class="nm">${esc(t.name)}</span><span></span><span class="pts">${t.score.toLocaleString('es-HN')}</span></div>`).join('')}</div>` : ''}
  <div class="row" style="justify-content:center"><button class="btn primary big" data-act="again">Jugar otra vez con las mismas mesas</button><button class="btn big" data-act="setup">Nueva partida</button></div>`;
}

function playAgain(){
  H.qs = buildQs();
  H.qi = -1; H.teams.forEach(t => { t.score = 0; t.last = 0; t.rb = 0; send(t, {t:'welcome', name:t.name, score:0}) });
  H.phase = 'lobby'; djBroadcast(); renderLobby();
}

/* ================= JUGADOR (celular) ================= */
const P = { code:'', name:'', peer:null, conn:null, score:0 };

function renderJoin(code){
  app.innerHTML = `<div class="phone">${topBar()}
    <form class="panel stack" id="joinForm">
      <div class="eyebrow">Sala ${esc(code)}</div>
      <h1 class="display" style="font-size:44px">¿Cómo se llama tu mesa?</h1>
      <input type="hidden" id="jcode" value="${esc(code)}">
      <div class="field"><label for="jname">Nombre del equipo</label><input type="text" id="jname" maxlength="24" placeholder="Ej. Mesa 7 · Los Fugados" autofocus></div>
      <button class="btn primary big" type="submit">Entrar a la trivia</button>
    </form></div>`;
  const n = ls.get('pf_name'); if (n) document.getElementById('jname').value = n;
}
function pScreen(inner){ app.innerHTML = `<div class="phone"><div class="phead"><span>${esc(P.name)}</span><span class="row" style="gap:10px"><span class="score">${P.score.toLocaleString('es-HN')} pts</span><button class="btn" data-act="sound" id="soundBtn" aria-pressed="${SFX.on}" style="padding:8px 12px;font-size:14px">${SFX.on ? '♪ Sí' : '♪ No'}</button></span></div>${inner}</div>` }
function pWait(title, sub){ pScreen(`<div class="center"><h1 class="display" style="font-size:42px">${title}</h1>${sub?`<p class="muted" style="margin:0">${sub}</p>`:''}</div>`) }
function pError(msg){ pScreen(`<div class="center"><h1 class="display" style="font-size:38px">No pudimos entrar</h1><p class="muted" style="margin:0">${msg}</p><button class="btn primary" data-act="retry">Intentar de nuevo</button><button class="btn" data-act="home">Cambiar código</button></div>`) }

function pConnect(){
  pWait('Conectando…', 'Entrando a la sala ' + esc(P.code));
  if (typeof Peer === 'undefined') return pError('Abre la trivia desde el enlace o el QR de la pantalla del bar.');
  try{ if (P.peer) P.peer.destroy() }catch(e){}
  const p = new Peer({debug:0}); P.peer = p;
  p.on('open', () => {
    const c = p.connect(PREFIX + P.code, {reliable:true}); P.conn = c;
    c.on('open', () => c.send({t:'join', name:P.name, dj:!!P.dj}));
    c.on('data', onPlayerMsg);
    c.on('close', () => pError('Se perdió la conexión con la pantalla del bar. Tus puntos se guardan si vuelves a entrar con el mismo nombre.'));
  });
  p.on('error', e => pError(e.type === 'peer-unavailable' ? `No encontramos la sala ${esc(P.code)}. Revisa el código en la pantalla del bar.` : 'Revisa tu conexión a internet e intenta de nuevo.'));
}

function songLinks(s){
  const q = encodeURIComponent(s.title + ' ' + s.artist);
  return `<div class="row"><a class="btn primary" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">Buscar en YouTube</a><a class="btn" href="https://open.spotify.com/search/${q}" target="_blank" rel="noopener">Buscar en Spotify</a></div>`;
}
function renderDJJoin(code){
  P.code = code; P.name = 'DJ'; P.dj = true;
  app.innerHTML = `<div class="phone">${topBar()}
    <div class="panel stack">
      <div class="eyebrow">Sala ${esc(code)} · Modo DJ</div>
      <h1 class="display" style="font-size:44px">Tú pones la música</h1>
      <p class="muted" style="margin:0">En las preguntas de "Adivina la canción" aquí te sale qué canción poner. No le enseñes esta pantalla a las mesas.</p>
      <button class="btn primary big" data-act="djgo">Conectar como DJ</button>
    </div></div>`;
}
function renderDJ(d){
  app.innerHTML = `<div class="phone"><div class="phead"><span>Modo DJ · Sala ${esc(P.code)}</span></div>
    ${d.now ? `<div class="panel stack" style="border-color:var(--amber)"><div class="eyebrow">Pon ahora</div><h1 class="display" style="font-size:40px">${esc(d.now.title)}</h1><p style="margin:0;font-weight:700">${esc(d.now.artist)}</p>${songLinks(d.now)}</div>`
      : `<div class="panel stack"><div class="eyebrow">Ahora</div><h2 class="display" style="font-size:32px">Sin canción por ahora</h2><p class="muted" style="margin:0">Cuando salga una pregunta de canción, aquí te aparece cuál poner.</p></div>`}
    ${d.next && (!d.now || d.next !== d.now) ? `<div class="panel stack"><div class="eyebrow">Prepara la siguiente</div><h2 class="display" style="font-size:30px">${esc(d.next.title)}</h2><p style="margin:0;font-weight:700">${esc(d.next.artist)}</p>${songLinks(d.next)}</div>` : ''}
  </div>`;
}
function onPlayerMsg(d){
  if (!d || typeof d !== 'object') return;
  if (P.dj){ if (d.t === 'dj') renderDJ(d); return }
  if (d.t === 'welcome'){ P.name = d.name; P.score = d.score; pWait('¡Ya estás dentro!', 'Mira la pantalla del bar. La trivia empieza en un momento.') }
  else if (d.t === 'q'){
    const sec = Math.max(0, d.left/1000);
    pScreen(`<div class="eyebrow">${esc(d.label || ('Pregunta ' + (d.i+1) + ' de ' + d.total))}</div>
      <div class="ptrack"><i style="animation-duration:${sec}s"></i></div>
      <div class="pq">${esc(d.text)}</div>
      <div class="pbtns">${d.opts.map((o,i) => `<button class="ans c${i}" data-act="pick" data-i="${d.i}" data-k="${i}"><span class="sh">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`);
  }
  else if (d.t === 'round'){ pWait(`Ronda ${d.n} de ${d.total}`, `Tema: ${esc(d.name)}. ¡Prepárense!`) }
  else if (d.t === 'got') pWait('Respuesta enviada', 'Espera a que se acabe el tiempo.');
  else if (d.t === 'res'){
    P.score = d.score;
    if (d.ok) SFX.ding(); else SFX.laugh();
    pScreen(`<div class="center"><div class="result ${d.ok?'ok':'bad'}" style="width:100%">
      <h1 class="display">${d.ok ? '¡Correcto!' : d.answered ? 'Fallaste' : 'Se acabó el tiempo'}</h1>
      <p style="margin:8px 0 0;font-size:22px;font-weight:800">${d.ok ? '+' + d.pts + ' pts' : 'Era: ' + esc(d.correct)}</p></div>
      <p class="muted" style="margin:0">Van en el puesto <strong style="color:var(--paper)">${d.rank}</strong> de ${d.n}</p></div>`);
  }
  else if (d.t === 'wait'){ P.score = d.score; d.prize ? pWait('¡Ganaron la ronda!', `Se llevan: ${esc(d.prize)}. Reclámenlo en la barra. Van en el puesto ${d.rank} de ${d.n}.`) : pWait(`Puesto ${d.rank} de ${d.n}`, 'Prepárense para la siguiente pregunta.') }
  else if (d.t === 'end'){ P.score = d.score; pWait(d.rank === 1 ? '¡Son los más buscados!' : `Terminaron en el puesto ${d.rank}`, `${d.score.toLocaleString('es-HN')} puntos en total.${d.prize ? ' Se llevan: ' + esc(d.prize) + '. Reclámenlo en la barra.' : ''} ¡Gracias por jugar en Prófugos!`) }
}

/* ---------- eventos ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  SFX.unlock();
  if (a === 'sound'){ const on = SFX.toggle(); document.querySelectorAll('#soundBtn').forEach(x => { x.setAttribute('aria-pressed', on); x.textContent = x.closest('.phead') ? (on ? '♪ Sí' : '♪ No') : (on ? '♪ Sonido activado' : '♪ Sonido apagado') }); return }
  if (a === 'home'){ history.replaceState && (()=>{ try{ history.replaceState(null,'',location.pathname) }catch(e){} })(); renderHome() }
  else if (a === 'setup'){ try{ H.peer && H.peer.destroy() }catch(e){} H.peer = null; renderSetup() }
  else if (a === 'cat'){ const k=b.dataset.k; H.cfg.cats.has(k)?H.cfg.cats.delete(k):H.cfg.cats.add(k); renderSetup() }
  else if (a === 'count'){ H.cfg.count = +b.dataset.n; renderSetup() }
  else if (a === 'time'){ H.cfg.time = +b.dataset.n; renderSetup() }
  else if (a === 'round'){ H.cfg.round = +b.dataset.n; renderSetup() }
  else if (a === 'rounds'){ H.cfg.rounds = +b.dataset.n; while (H.cfg.themes.length < H.cfg.rounds) H.cfg.themes.push(DEF_THEMES[H.cfg.themes.length] || 'mix'); saveThemes(); renderSetup() }
  else if (a === 'rprize'){ H.cfg.roundPrize = b.dataset.n === '1'; ls.set('pf_rprize', H.cfg.roundPrize ? 'on' : 'off'); renderSetup() }
  else if (a === 'per'){ H.cfg.per = +b.dataset.n; ls.set('pf_per', String(H.cfg.per)); renderSetup() }
  else if (a === 'saveCustom'){ ls.set('pf_custom', document.getElementById('custom').value); H.cfg.cats.add('casa'); renderSetup(); }
  else if (a === 'create') hostCreate();
  else if (a === 'start') nextStep();
  else if (a === 'roundgo') startQuestion();
  else if (a === 'close') closeQuestion();
  else if (a === 'mok') toggleManual(b.dataset.id);
  else if (a === 'board') renderBoard();
  else if (a === 'next') nextStep();
  else if (a === 'again') playAgain();
  else if (a === 'retry') pConnect();
  else if (a === 'djgo') pConnect();
  else if (a === 'replay'){ const q = H.qs[H.qi]; if (q && q.kind === 'mel') SFX.melody(q.notes, q.bpm) }
  else if (a === 'peek'){ const q = H.qs[H.qi], el = document.getElementById('peek'); if (q && q.song && el){ el.textContent = q.song.title + ' — ' + q.song.artist; clearTimeout(H.peekT); H.peekT = setTimeout(() => { el.textContent = '' }, 4000) } }
  else if (a === 'pick'){
    if (P.conn && P.conn.open){ P.conn.send({t:'ans', i:+b.dataset.i, k:+b.dataset.k}) }
    app.querySelectorAll('.pbtns .ans').forEach(x => { x.disabled = true; if (x !== b) x.classList.add('dim') });
  }
});
app.addEventListener('change', e => {
  const r = e.target.dataset && e.target.dataset.round;
  if (r != null){ H.cfg.themes[+r] = e.target.value; saveThemes() }
});
app.addEventListener('input', e => {
  if (e.target.id === 'prRound'){ PRIZE_MEM.round = e.target.value; ls.set('pf_prize_round', e.target.value) }
  if (e.target.id === 'prFinal'){ PRIZE_MEM.final = e.target.value; ls.set('pf_prize_final', e.target.value) }
});
app.addEventListener('submit', e => {
  e.preventDefault();
  SFX.unlock();
  if (e.target.id === 'joinForm'){
    const code = (document.getElementById('jcode').value||'').replace(/\D/g,'').slice(0,4);
    const name = (document.getElementById('jname').value||'').trim().slice(0,24);
    if (code.length !== 4){ document.getElementById('jcode').focus(); return }
    if (!name){ document.getElementById('jname').focus(); return }
    P.code = code; P.name = name; ls.set('pf_name', name); pConnect();
  } else if (e.target.id === 'manualForm'){
    const v = document.getElementById('mname').value.trim().slice(0,24); if (!v) return;
    H.teams.push({id:'m'+Date.now(), name:v, score:0, last:0, conn:null, online:false, manual:true}); renderLobby();
    const m = document.getElementById('mname'); if (m) m.focus();
  }
});

let sala = null, djMode = false; try{ const sp = new URLSearchParams(location.search); sala = sp.get('sala'); djMode = sp.get('dj') === '1' }catch(e){}
if (sala && /^\d{4}$/.test(sala)) (djMode ? renderDJJoin(sala) : renderJoin(sala)); else renderHome();
</script>

</body></html>
